# Livestart 数据库分库分表核心配置文件 (ShardingSphere-JDBC 规范)
# 结合标准微服务高并发架构进行设计，通过 JDBC 驱动直接挂载

# =========================================================================
# 1. 物理数据源定义集合 (支持 HikariCP 连接池)
# =========================================================================
mode:
  type: Standalone

dataSources:
  # 1.1 公共配置与元数据库
  ds_common:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3306/live_start?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # ShardingSphere JDBC 5.3.2 parses this YAML directly; Spring placeholders are not resolved here.
    username: &db_user root
    password: &db_pass 123456
  
  # 1.2 用户分库 0
  ds_user_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3306/ds_user_0?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: *db_user
    password: *db_pass

  # 1.3 用户分库 1
  ds_user_1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3306/ds_user_1?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: *db_user
    password: *db_pass

# =========================================================================
# 2. 分片及数据路由规则定义
# =========================================================================
rules:
  - !SHARDING
    tables:
      # 2.1 用户主表 t_user (分2库8表，按 id 分片)
      t_user:
        actualDataNodes: ds_user_${0..1}.t_user_${0..7}
        databaseStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: user_hash_mod
        tableStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: user_hash_mod
        # 主键生成策略 (雪花算法)
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflake

      # 2.2 用户社交资料表 t_user_profile (分2库8表，按 user_id 分片)
      t_user_profile:
        actualDataNodes: ds_user_${0..1}.t_user_profile_${0..7}
        databaseStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: user_hash_mod
        tableStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: user_hash_mod

      # 2.3 常用观演人表 t_user_visitor (分2库8表，按 user_id 分片)
      t_user_visitor:
        actualDataNodes: ds_user_${0..1}.t_user_visitor_${0..7}
        databaseStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: user_hash_mod
        tableStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: user_hash_mod
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflake

    # 绑定表 (Binding Tables) 关系定义：保证库内本地关联 Join
    bindingTables:
      - t_user,t_user_profile,t_user_visitor

    # =========================================================================
    # 3. 分片算法具体配置
    # =========================================================================
    shardingAlgorithms:
      user_hash_mod:
        type: CLASS_BASED
        props:
          strategy: standard
          algorithmClassName: com.mongxin.livestart.admin.dao.sharding.UserHashModShardingAlgorithm

    # =========================================================================
    # 4. 主键生成器定义
    # =========================================================================
    keyGenerators:
      snowflake:
        type: SNOWFLAKE

  - !SINGLE
    defaultDataSource: ds_common

# =========================================================================
# 5. 全局基础属性配置
# =========================================================================
props:
  sql-show: true
