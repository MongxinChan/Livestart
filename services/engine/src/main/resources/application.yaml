server:
  port: 8004

spring:
  application:
    name: Livestart-engine
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-config.yaml
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: false
      password: nacos
      username: nacos
  data:
    redis:
      host: 127.0.0.1
      port: 6379

feign:
  pay:
    url: ${LIVESTART_PAY_URL:http://127.0.0.1:8009}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  default-flat-param-object: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.mongxin.livestart.engine

knife4j:
  enable: true
  setting:
    language: zh_cn

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: Livestart_engine-service_common-message-execute_pg
    send-message-timeout: 2000
    retry-times-when-send-failed: 1
    retry-times-when-send-async-failed: 1

livestart:
  engine:
    internal-token: ${LIVESTART_INTERNAL_TOKEN:change-me}
    order-close-delay-minutes: 15
    local-order-mode: ${LIVESTART_ENGINE_LOCAL_ORDER_MODE:false}
    auto-warm-stock-on-miss: true
    mq:
      # 本地未启 RocketMQ 时可通过 LIVESTART_ENGINE_MQ_ENABLED=false 让下单/支付走直写分支
      enabled: ${LIVESTART_ENGINE_MQ_ENABLED:true}

