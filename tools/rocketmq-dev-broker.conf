brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=24
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH

# Local dev store path.
storePathRootDir=F:/tmp/rocketmq-store-livestart
storePathCommitLog=F:/tmp/rocketmq-store-livestart/commitlog
storePathConsumeQueue=F:/tmp/rocketmq-store-livestart/consumequeue
storePathIndex=F:/tmp/rocketmq-store-livestart/index
storeCheckpoint=F:/tmp/rocketmq-store-livestart/checkpoint
abortFile=F:/tmp/rocketmq-store-livestart/abort

# Local dev disk thresholds.
# RocketMQ expects percentage-style thresholds here.
diskMaxUsedSpaceRatio=99
diskSpaceWarningLevelRatio=99
diskSpaceCleanForciblyRatio=95
